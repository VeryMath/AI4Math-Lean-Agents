# Phase 3 评测任务规格（恰好 6 条）
# dry-run / offline 可随时跑；真 API：--real-api（$5/run 硬顶）
# runner：~/numina-lean-agent → python -m scripts.run_eval

version: 1
description: >
  End-to-end success-rate eval for numina-lean-agent against this Lean corpus.
  Primary KPI: success rate. Cost is secondary but hard-capped per run.

quota:
  max_usd_per_run: 5
  max_rounds: 5
  max_model_tier: 3
  # 课题组默认叙事 = Mode A；国内个人开发者实操推荐先 Mode C（见 docs/AUTH.md）
  default_auth_mode: A   # Gemini+LiteLLM (WSL)
  fallback_auth_mode: C  # DeepSeek 直连；run_eval --auth-mode C

harness:
  placeholder: false
  entrypoint: >
    cd ~/numina-lean-agent && source .venv/bin/activate && PYTHONPATH=$PWD
    python -m scripts.run_eval --config <lean>/eval/tasks.yaml
    --project-root <lean>
    [--dry-run | --offline | --real-api [--auth-mode C|A|auto]]
  notes: >
    Hard caps from quota.* ($ / rounds / tier). Prefer lake env lean verification.
    Without API keys: --dry-run or --offline.
    Live run_claude per prove/fix task: --real-api (auto prefers Mode C if DEEPSEEK_API_KEY).
    Skip importing broken fixtures into the root module.
    Do not burn quota blindly; stop when spent_usd >= max_usd_per_run.

tasks:
  - id: T1_interactive_demo
    name: InteractiveDemo smoke / formalize target
    path: StatInferenceLean/Exercises/InteractiveDemo.lean
    kind: prove_or_verify
    expect: compile_ok
    max_rounds: 3

  - id: T2_week01_subset
    name: Week01 exercise file
    path: StatInferenceLean/Exercises/Week01.lean
    kind: prove_or_verify
    expect: compile_ok
    max_rounds: 5

  - id: T3_errorbank_broken
    name: ErrorBankDemo broken (unknown identifier)
    path: StatInferenceLean/Exercises/Fixtures/ErrorBankDemo.broken.lean
    kind: fix_then_verify
    expect: agent_repairs_to_compile_ok
    reference_fixed: StatInferenceLean/Exercises/Fixtures/ErrorBankDemo.fixed.lean
    max_rounds: 5
    max_model_tier: 3

  - id: T4_errorbank_fixed
    name: ErrorBankDemo fixed control
    path: StatInferenceLean/Exercises/Fixtures/ErrorBankDemo.fixed.lean
    kind: verify_only
    expect: compile_ok
    max_rounds: 1

  - id: T5_bernoulli
    name: Bernoulli corpus (not in default root import)
    path: StatInferenceLean/Exercises/Bernoulli.lean
    kind: verify_only
    expect: compile_ok
    max_rounds: 1
    notes: Run via `lake env lean` only; do not add to StatInferenceLean.lean.

  - id: T6_week02_subset
    name: Week02 exercise file
    path: StatInferenceLean/Exercises/Week02.lean
    kind: prove_or_verify
    expect: compile_ok
    max_rounds: 5
