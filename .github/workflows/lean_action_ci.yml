name: Lean Action CI

# Skill is the single source for OpenCode. After editing
# .cursor/skills/lean-agent-numina/SKILL.md you MUST run
# scripts/sync_opencode_agent.ps1 / .sh (CI checks --check).

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Skill and OpenCode agent stay in sync
        run: bash ./scripts/sync_opencode_agent.sh --check
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
